<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<script>
			// Apply the saved theme before first paint (mockup convention: light = data-theme="light").
			try {
				if (localStorage.getItem('ko-theme') === 'light')
					document.documentElement.dataset.theme = 'light';
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
