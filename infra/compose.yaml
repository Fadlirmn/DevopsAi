# Full stack — same file for local and VPS; only infra/.env differs.
#   docker compose -f infra/compose.yaml up -d --build
#
# Only Caddy publishes ports. db sits on an internal-only network (no route in
# or out). rag is on that network plus `egress`, a normal bridge that gives it
# outbound internet for the AI provider APIs but publishes nothing inbound.
#
# One-shot jobs on every `up`:
#   migrate — applies database/migrations/*.sql once each (rag waits for it)
#   seed    — downloads + ingests the public seed corpus (SEED_SET=all|demo);
#             idempotent, and its failure never blocks the app
#
# For the Vercel + VPS demo, add compose.vercel.yaml (opens rag on RAG_DOMAIN,
# key-protected) — see README "Demo di Vercel".
name: knowledgeops

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

# Shared by rag, migrate and seed (seed embeds documents with the same
# embedder the API uses at query time).
x-rag-env: &rag-env
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_EFFORT: ${LLM_EFFORT:-low}
  LLM_PRICE_INPUT_PER_MTOK: ${LLM_PRICE_INPUT_PER_MTOK:-}
  LLM_PRICE_OUTPUT_PER_MTOK: ${LLM_PRICE_OUTPUT_PER_MTOK:-}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
  RATE_LIMIT_PER_DAY: ${RATE_LIMIT_PER_DAY:-100}
  DAILY_SPEND_CAP_USD: ${DAILY_SPEND_CAP_USD:-}
  RETRIEVAL_MIN_SIMILARITY: ${RETRIEVAL_MIN_SIMILARITY:-}
  RAG_API_KEY: ${RAG_API_KEY:-}
  PIPELINE_VERSION: ${PIPELINE_VERSION:-}

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in infra/.env}
      POSTGRES_USER: ${POSTGRES_USER:?set in infra/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in infra/.env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]
    mem_limit: 512m
    logging: *logging

  migrate:
    build: ../services/rag
    command: ["python", "scripts/migrate.py", "/migrations"]
    environment: *rag-env
    volumes:
      - ../database/migrations:/migrations:ro
    depends_on:
      db: { condition: service_healthy }
    networks: [backend]
    restart: "no"
    logging: *logging

  seed:
    build: ../services/rag
    command: ["python", "scripts/seed_corpus.py", "--set", "${SEED_SET:-all}"]
    environment:
      <<: *rag-env
      CORPUS_CACHE_DIR: /corpus
    volumes:
      - corpus_cache:/corpus  # downloaded originals, so restarts don't re-download
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [backend, egress]
    extra_hosts: ["host.docker.internal:host-gateway"]  # Ollama on the host
    restart: "no"
    mem_limit: 512m
    logging: *logging

  rag:
    build: ../services/rag
    restart: unless-stopped
    environment: *rag-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [backend, egress]
    extra_hosts: ["host.docker.internal:host-gateway"]  # Ollama on the host
    mem_limit: 384m
    logging: *logging

  web:
    build: ../apps/web
    restart: unless-stopped
    environment:
      RAG_SERVICE_URL: http://rag:8000
      RAG_API_KEY: ${RAG_API_KEY:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      ADMIN_UIDS: ${ADMIN_UIDS:-}
      PUBLIC_FIREBASE_API_KEY: ${PUBLIC_FIREBASE_API_KEY:-}
      PUBLIC_FIREBASE_AUTH_DOMAIN: ${PUBLIC_FIREBASE_AUTH_DOMAIN:-}
      PUBLIC_FIREBASE_PROJECT_ID: ${PUBLIC_FIREBASE_PROJECT_ID:-}
      # web is only reachable through Caddy, so its forwarded headers are
      # trustworthy — gives SvelteKit the real public origin (https + host)
      # and the real visitor IP for the rate limit.
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: "1"
    depends_on:
      rag: { condition: service_healthy }
    networks: [backend, edge]
    mem_limit: 384m
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set in infra/.env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }
    networks: [edge]
    mem_limit: 256m
    logging: *logging

networks:
  backend:
    internal: true
  egress: {}
  edge: {}

volumes:
  db_data:
  corpus_cache:
  caddy_data:
  caddy_config:
