# Full stack — same file for local and VPS; only infra/.env differs.
#   docker compose -f infra/compose.yaml up -d --build
# Only Caddy publishes ports. db and rag sit on an internal-only network
# (no route out, no route in); web bridges it to the edge network.
name: knowledgeops

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in infra/.env}
      POSTGRES_USER: ${POSTGRES_USER:?set in infra/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in infra/.env}
    volumes:
      # Applied only when the volume is empty (first start). Later migrations
      # need an explicit run — see README "Docker".
      - ../database/migrations:/docker-entrypoint-initdb.d:ro
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]
    mem_limit: 512m
    logging: *logging

  rag:
    build: ../services/rag
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PIPELINE_VERSION: ${PIPELINE_VERSION:-dev-mock-v1}
    depends_on:
      db: { condition: service_healthy }
    networks: [backend]
    mem_limit: 384m
    logging: *logging

  web:
    build: ../apps/web
    restart: unless-stopped
    environment:
      RAG_SERVICE_URL: http://rag:8000
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      ADMIN_UIDS: ${ADMIN_UIDS:-}
      PUBLIC_FIREBASE_API_KEY: ${PUBLIC_FIREBASE_API_KEY:-}
      PUBLIC_FIREBASE_AUTH_DOMAIN: ${PUBLIC_FIREBASE_AUTH_DOMAIN:-}
      PUBLIC_FIREBASE_PROJECT_ID: ${PUBLIC_FIREBASE_PROJECT_ID:-}
      # web is only reachable through Caddy, so its forwarded headers are
      # trustworthy — gives SvelteKit the real public origin (https + host).
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: "1"
    depends_on:
      rag: { condition: service_healthy }
    networks: [backend, edge]
    mem_limit: 384m
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set in infra/.env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }
    networks: [edge]
    mem_limit: 256m
    logging: *logging

networks:
  backend:
    internal: true
  edge: {}

volumes:
  db_data:
  caddy_data:
  caddy_config:
