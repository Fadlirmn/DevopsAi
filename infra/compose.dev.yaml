services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledgeops
      POSTGRES_USER: knowledgeops_app
      POSTGRES_PASSWORD: dev_only_password
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - ../database/migrations:/docker-entrypoint-initdb.d:ro
      - knowledgeops_dev_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledgeops_app -d knowledgeops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  knowledgeops_dev_db:
